name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          DOMAIN: ${{ secrets.DOMAIN }}

      - name: Debug server permissions
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            whoami
            id
            ls -ld /opt /opt/www || true
            touch /opt/www/.perm_test && rm -f /opt/www/.perm_test

      - name: Upload release to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: 'dist,docker-compose.yml,Caddyfile'
          target: ${{ secrets.VPS_PATH }}
          tar_tmp_path: /tmp
          rm: true
          debug: true

      - name: Restart stack on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_PATH }}"
            printf 'DOMAIN=%s\n' '${{ secrets.DOMAIN }}' > .env
            docker compose pull
            docker compose up -d --remove-orphans
